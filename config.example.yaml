mesh:
  transport: tcp

  tcp:
    host: 192.168.1.80
    port: 4403

  ble:
    address: null

  serial:
    port: null

  channel: 0

  reconnect:
    attempts: 3
    timeout: 10
    delay: 3
    retry_after_failure: 30

ai:
  mode: fallback

  request:
    attempts_per_provider: 2
    timeout: 20

  providers:
    local:
      name: "Lil Local Guy"
      type: ollama
      enabled: true
      priority: 1
      host: http://127.0.0.1:11434
      model: qwen3:8b
      keep_alive: 30m
      options:
        temperature: 0.7
        num_ctx: 8192
        num_predict: 180

