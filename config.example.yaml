bridge:
  chunk_bytes: 180
  chunk_delay: 1.0
  response_max_bytes: 600
  history_messages: 12
  queue_size: 50
  max_concurrent_requests: 2

  system_prompt: |
    You are communicating over Meshtastic.
    Keep responses concise and appropriate for a low-bandwidth radio connection.

logging:
  level: INFO
  retain_lines: 1000
