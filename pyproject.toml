[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-ai-gateway"
version = "0.1.0"
description = "A headless Meshtastic AI gateway with provider failover and a detachable curses TUI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = [
  "meshtastic>=2.7.11,<3.0",
  "PyYAML>=6.0.1,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mesh-ai-gateway = "mesh_ai_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["mesh_ai_gateway*"]
